# These modules deliberately compose several subsystems. Splitting them merely to lower
# fan-out would hide the integration boundary the tests and runtime are meant to make visible.
suppressions.test-game.rule=wide-coupling
suppressions.test-game.subject=TestGame
suppressions.test-game.reason=The rules integration suite deliberately drives every game subsystem together.

suppressions.test-session.rule=wide-coupling
suppressions.test-session.subject=TestSession
suppressions.test-session.reason=The cabinet integration suite exercises games, screens, input, scoring, and handover together.

suppressions.test-stats.rule=wide-coupling
suppressions.test-stats.subject=TestStats
suppressions.test-stats.reason=Telemetry tests intentionally join the frame figures, input toggle, session, and rendered overlay.

suppressions.screens.rule=wide-coupling
suppressions.screens.subject=Screens
suppressions.screens.reason=The cabinet renderer is the intentional composition point for game, overlays, palette, scores, and build metadata.

suppressions.bench.rule=wide-coupling
suppressions.bench.subject=Bench
suppressions.bench.reason=The benchmark intentionally composes tuning, bot, rules, simulation, and command-line reporting.

suppressions.sketch.rule=wide-coupling
suppressions.sketch.subject=Sketch
suppressions.sketch.reason=The frame-loop boundary intentionally joins timing, input, canvas, audio, surface, and pure callbacks.
