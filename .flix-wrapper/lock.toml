# Pinned by hand, not by `./flix pin`.
#
# `pin` builds its URL from the upstream release convention -- github.com/flix/flix,
# tag v<version>, asset flix.jar -- and this compiler is none of those: a fork, a
# different repository, and an asset named after the full version. Running `./flix pin`
# here would silently replace this with the upstream 0.75.2 and the project would build
# against a different compiler than it says it does. Edit this file instead until the
# wrapper can express an origin.
#
# The build metadata is what distinguishes the fork; the wrapper strips it when forming
# a cache coordinate, so the cached jar is keyed by its digest rather than by the tag.
wrapperVersion = "0.3.0"

[compiler]
version = "0.75.2+fork.wstein.260807.1"
url     = "https://github.com/wstein/flix-fork/releases/download/v0.75.2%2Bfork.wstein.260807.1/flix-0.75.2%2Bfork.wstein.260807.1.jar"
sha256  = "fb1db0211f9426a88d22a28bd063a124afbd2e0f123c9f88fc83bc01e915ae30"
