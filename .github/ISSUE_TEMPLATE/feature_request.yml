name: Feature request
description: Suggest an improvement to the game or its teaching material.
title: "idea: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or learning goal
      description: What would this make easier, clearer, or more fun?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful version of the idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — are there other ways to solve the same problem?
