name: API Documentation

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build API Documentation
    runs-on: ubuntu-latest

    outputs:
      pages: ${{ steps.pages.outcome }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore the pinned compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/flixw
            ~/Library/Caches/flixw
            ~\AppData\Local\flixw
          key: ${{ runner.os }}-flixw-${{ hashFiles('.flixw/lock.toml') }}

      - name: Generate
        run: ./flixw doc

      # Flix 0.80 generates the project site and linked source pages in build/doc.
      # Publish the tree together to preserve the compiler-generated links.
      - name: Verify the generated documentation
        run: |
          set -euo pipefail
          test -s build/doc/index.html

          # The compiler links to these standard library traits but omits their pages.
          for trait in Eq Order ToString; do
            if [ ! -f "build/doc/$trait.html" ]; then
              sed -i -E "s|(href=')$trait[.]html([#'])|\1https://api.flix.dev/$trait.html\2|g" build/doc/*.html
            fi
          done

          while IFS= read -r target; do
            if [ ! -f "build/doc/$target" ]; then
              echo "::error::Generated documentation links to missing page $target"
              exit 1
            fi
          done < <(grep -hoE "href='[A-Za-z0-9_.-]+[.]html[#']" build/doc/*.html |
            sed "s/^href='//; s/[#']$//" | sort -u)

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true
        with:
          enablement: true

      - name: Report that publishing was skipped
        if: github.event_name != 'pull_request' && steps.pages.outcome != 'success'
        run: echo "::warning::Pages is not enabled for this repository, so the documentation was built but not published. Turn it on once under Settings > Pages with source 'GitHub Actions', or delete .github/workflows/docs.yaml."

      - name: Upload
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/doc

  deploy:
    name: Publish to Pages
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
