name: Smoke

# Launches each sketch in a real window on all three desktop platforms and checks it starts,
# draws, and exits cleanly. The unit tests deliberately never open a window, so this is the
# only place the Processing integration itself is exercised.
#
# It is not on every pull request: it needs a display, and it is slower and more fragile than
# the headless suite.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache toolchain and dependencies
        uses: actions/cache@v5
        with:
          path: |
            .flix
            lib
          key: flix-${{ runner.os }}-${{ hashFiles('flix.toml') }}

      # Linux runners have no display. Without Xvfb, Processing's ShimAWT hits a
      # HeadlessException and calls System.exit(1) -- a bare exit code with no stack trace.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Launch each sketch
        shell: bash
        env:
          FLIX_SKETCH_MAX_FRAMES: 120
        run: |
          set -euo pipefail

          launch() {
            echo "--- $* ---"
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a "$@"
            else
              "$@"
            fi
          }

          launch bin/sketch static
          launch bin/sketch animation
          launch bin/sketch invaders
