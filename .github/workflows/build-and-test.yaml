name: Build and Test

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Keep the wrapper cache inside the workspace so actions/cache can see it. Without
    # this it lands in ~/.cache/flixw on Linux and ~/Library/Caches/flixw on macOS, and
    # one cache path cannot name both.
    env:
      FLIX_CACHE_HOME: ${{ github.workspace }}/.flix-cache
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # ./flixw caches the pinned compiler by content, and dependency resolution
      # populates lib/. The lock names the exact compiler bytes, so it belongs in the
      # key: a cache hit that predates a repin would otherwise be discarded anyway,
      # since the wrapper re-hashes the jar on every run.
      - name: Cache toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            .flix-cache
            lib
          key: flix-${{ runner.os }}-${{ hashFiles('flix.toml', '.flixw/lock.toml') }}

      # The wrapper before the compiler: if a generated file was edited by hand or a
      # lock stopped matching the manifest, every result after this point is suspect.
      - name: Validate the wrapper
        run: ./flixw validate

      - name: Check
        run: ./flixw check

      - name: Test
        run: ./flixw test

      # The test suite must stay headless: no @Test may open a window or a sound line.
      # Runners have neither a display nor a mixer -- Processing's ShimAWT calls
      # System.exit(1) on HeadlessException, and AudioSystem throws an unchecked
      # IllegalArgumentException when no mixer exists.
      - name: Verify tests are headless
        run: |
          if grep -rn 'Sketch\.start\|Audio\.' test/; then
            echo "::error::test/ must not open a window or an audio device."
            echo "::error::Use Canvas.runWithCollector for drawing and Sound.played for audio."
            exit 1
          fi

      # Fs.FileRead and Fs.FileWrite carry @DefaultHandler, so a test that simply forgets
      # a handler still compiles -- and then reads and writes the runner's real disk.
      # There is no compiler backstop for this, so it is a grep: any test that names Fs.
      # must install the in-memory filesystem.
      - name: Verify tests never touch the real filesystem
        run: |
          status=0
          for file in $(grep -rl 'Fs\.' test/ || true); do
            if ! grep -q 'withInMemoryFS' "$file"; then
              echo "::error file=$file::names Fs. without Fs.FileSystem.withInMemoryFS;"
              echo "::error file=$file::this test would read or write the real filesystem."
              status=1
            fi
          done
          exit $status

      # `flix.toml` had drifted three releases behind the tags before anything read it, and
      # the game now states a version on screen -- so the two must be checked against each
      # other or the attract screen will confidently announce the wrong build.
      - name: Verify the version is stated once
        run: |
          declared=$(grep -oE '^version[[:space:]]*=[[:space:]]*"[^"]+"' flix.toml | sed 's/.*"\(.*\)"/\1/')
          insource=$(grep -oE 'pub def version\(\): String = "[^"]+"' src/Meta.flix | sed 's/.*"\(.*\)"/\1/')
          echo "flix.toml: $declared   Meta.version(): $insource"
          if [ "$declared" != "$insource" ]; then
            echo "::error::flix.toml says $declared but Meta.version() says $insource"
            exit 1
          fi

      - name: Verify formatting
        run: |
          ./flixw format
          if ! git diff --exit-code -- src test; then
            echo "::error::Run './flixw format' and commit the result."
            exit 1
          fi
