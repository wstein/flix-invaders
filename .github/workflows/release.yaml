name: Release

# Tagging is the whole trigger: `git tag v0.2.0 && git push --tags`.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for a dry run; nothing is published)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Keep the wrapper cache inside the workspace so actions/cache can see it.
    env:
      FLIX_CACHE_HOME: ${{ github.workspace }}/.flix-cache
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            .flix-cache
            lib
          key: flix-${{ runner.os }}-${{ hashFiles('flix.toml', '.flixw/lock.toml') }}

      # A release must not ship something the tests have not seen.
      - name: Check
        run: ./flixw check

      - name: Test
        run: ./flixw test

      # `build-jar` packages whatever is in build/class, and Flix leaves the classes of
      # earlier builds behind -- a working copy that has been built a few dozen times
      # accumulates gigabytes of them, and they all end up in the artifact. A runner
      # starts clean, so this is belt and braces rather than a fix.
      # A release whose binary announces a different version than its tag is worse than one
      # that announces nothing.
      - name: Verify the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          insource=$(grep -oE 'pub def version\(\): String = "[^"]+"' src/Meta.flix | sed 's/.*"\(.*\)"/\1/')
          declared=$(grep -oE '^version[[:space:]]*=[[:space:]]*"[^"]+"' flix.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag: $tag   flix.toml: $declared   Meta.version(): $insource"
          if [ "$tag" != "$insource" ] || [ "$tag" != "$declared" ]; then
            echo "::error::tag $tag, flix.toml $declared, Meta.version() $insource -- all three must agree"
            exit 1
          fi

      - name: Build the jar
        run: |
          rm -rf build artifact
          ./flixw build-jar
          # Flix names the artifact after the checkout directory rather than the package, so
          # this depends on what the clone is called: on a runner it is already right, in a
          # working copy named anything else it is not.
          built=$(ls artifact/*.jar | head -1)
          [ "$built" = "artifact/flix-invaders.jar" ] || mv "$built" artifact/flix-invaders.jar
          # Flix compiles test/ as part of the project, so the artifact arrives carrying a
          # compiled copy of the whole suite -- half its size and none of its purpose.
          #
          # `zip -d` exits non-zero both when it fails and when nothing matched, so its status
          # cannot distinguish the two and swallowing it would let an unstripped jar through.
          # The check that matters is the state afterwards, so that is what is asserted.
          zip -q -d artifact/flix-invaders.jar 'Test*' || true
          if unzip -l artifact/flix-invaders.jar | grep -qE '[[:space:]]Test[A-Za-z0-9_$]*\.class'; then
            echo "::error::compiled tests are still in the release jar"
            unzip -l artifact/flix-invaders.jar | grep -E '[[:space:]]Test[A-Za-z0-9_$]*\.class' | head -5
            exit 1
          fi
          # The font is read from a path relative to the working directory, so it travels
          # inside the jar and the launcher unpacks it on first run. It is this project's own
          # asset; no dependency is packed in, and Processing least of all.
          jar uf artifact/flix-invaders.jar assets/PressStart2P-Regular.ttf
          # Nothing from Processing may be in here. Shading it would turn dynamic linking into
          # static linking and trigger LGPL-2.1 section 6; this is the check that says so.
          if unzip -l artifact/flix-invaders.jar | grep -qE 'processing/|com/jogamp'; then
            echo "::error::the jar contains Processing classes; it must link to them, not carry them"
            exit 1
          fi
          ls -lh artifact/

      # Linux runners have no display, and Processing's ShimAWT calls System.exit(1) on a
      # HeadlessException rather than throwing something catchable.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check the jar runs
        env:
          FLIX_SKETCH_MAX_FRAMES: 120
        run: |
          # Headless, bounded, and against Processing as a separate jar -- which is how it is
          # meant to be run and what THIRD-PARTY.md commits to.
          #
          # This is a *natural exit* check. The jar has to stop by itself: `Sketch` overrides
          # `exitActual` so closing the window returns to `main` to save the scores, which
          # leaves AWT's non-daemon event thread running, and `main` exits explicitly once the
          # saving is done. `./flixw run` hides a failure here because its launcher owns the
          # JVM -- so this step, on a plain `java`, is the only thing that tests it, and it
          # caught the released game hanging forever.
          #
          # `timeout` is a backstop that turns a hang into a failure rather than a six-hour
          # job. It is not what makes the check pass.
          # `timeout` goes *inside* `xvfb-run` so that it supervises the JVM itself. Wrapped
          # the other way round it bounds the wrapper, the signal never reaches the child, and
          # a hung game keeps the job alive regardless -- which is what happened here before
          # the natural exit was fixed. `-k` follows up with KILL if TERM is ignored.
          core=$(find lib -name 'processing-core*.jar' | head -1)
          xvfb-run -a timeout -k 15 180 java -cp "artifact/flix-invaders.jar:$core" Main
          echo "the jar opened a window, drew 120 frames and exited by itself"

      - name: Stamp the launcher
        run: |
          tag="${GITHUB_REF_NAME}"
          sha=$(sha1sum artifact/flix-invaders.jar | cut -d' ' -f1)
          sed -e "s|^VERSION=.*|VERSION=\"\${INVADERS_VERSION:-$tag}\"|" \
              -e "s|^GAME_SHA1=.*|GAME_SHA1=$sha|" \
              packaging/invaders > artifact/invaders
          chmod +x artifact/invaders
          # A launcher that cannot parse is worse than no launcher.
          sh -n artifact/invaders
          grep -q "GAME_SHA1=$sha" artifact/invaders
          echo "stamped $tag, jar sha1 $sha"

      - name: Write the release notes
        run: |
          cat > artifact/NOTES.md <<'NOTES'
          ## Play it

          ```sh
          curl -fsSLO https://github.com/wstein/flix-invaders/releases/latest/download/invaders
          chmod +x invaders
          ./invaders
          ```

          That script is the whole download. On first run it fetches the game and Processing
          Core into `~/.cache/flix-invaders`, checks both against pinned SHA-1s, unpacks the
          arcade font, and plays. After that it runs offline. Java 21 and nothing else.

          `./invaders --where` prints the cache directory; `--clean` removes it. Nothing is
          installed anywhere else.

          Prefer to run it yourself:

          ```sh
          java -cp flix-invaders.jar:core-4.5.6.jar Main
          ```

          Processing Core is a separate jar rather than shaded into the game's, because it is
          LGPL-2.1 and bundling it would convert dynamic linking into static linking. Replacing
          that jar is sufficient to run this against your own build of it -- see THIRD-PARTY.md.
          NOTES
          sed -i 's/^          //' artifact/NOTES.md
          head -3 artifact/NOTES.md

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifact/invaders artifact/flix-invaders.jar \
            --title "Flix Invaders ${GITHUB_REF_NAME}" \
            --notes-file artifact/NOTES.md
